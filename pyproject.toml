[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# By default skip tests that need the network or a live LLM key. Run them
# explicitly with:  pytest -m integration   or   pytest -m llm
addopts = "-m 'not integration and not llm'"
markers = [
    "integration: tests that hit the real network (HackerNews, RSS, GitHub)",
    "llm: tests that make a real LLM call via LiteLLM (needs an API key)",
]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines in prompts/markdown are fine

[tool.coverage.run]
source = ["src"]
omit = ["src/mcp_servers/hello_server.py", "src/mcp_servers/simple_client.py"]
